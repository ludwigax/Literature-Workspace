server {
  listen 80;
  server_name _;
  # The API enforces the authoritative 100 MiB PDF limit. Keep the proxy a
  # little higher so nginx does not reject valid uploads before FastAPI can
  # return the application's structured response.
  client_max_body_size 110m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream api:8020;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
