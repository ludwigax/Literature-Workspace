name: literature-workspace

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: literature_workspace
      POSTGRES_USER: literature
      POSTGRES_PASSWORD: literature
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature -d literature_workspace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/app/deploy/postgres/001-app-role.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: literature
      MINIO_ROOT_PASSWORD: literature-local-secret
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./services/app/deploy/keycloak/literature-v2-realm.json:/opt/keycloak/data/import/literature-v2-realm.json:ro

  migrate:
    build: ./services/app
    environment: &app-environment
      LITV2_ENV: development
      LITV2_DATABASE_URL: postgresql+psycopg://literature_app:literature-app-local@postgres:5432/literature_workspace
      LITV2_MIGRATION_DATABASE_URL: postgresql+psycopg://literature:literature@postgres:5432/literature_workspace
      LITV2_WORKER_DATABASE_URL: postgresql+psycopg://literature_worker:literature-worker-local@postgres:5432/literature_workspace
      LITV2_CHAT_WORKER_DATABASE_URL: postgresql+psycopg://chat_worker:chat-worker-local@postgres:5432/literature_workspace
      LITV2_OIDC_ISSUER: ${LITV2_PUBLIC_KEYCLOAK_URL:-http://127.0.0.1:8081}/realms/literature-v2
      LITV2_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/literature-v2/.well-known/openid-configuration
      LITV2_OIDC_CLIENT_ID: literature-v2-web
      LITV2_OIDC_CLIENT_SECRET: local-development-only
      LITV2_OIDC_BACKEND_BASE_URL: http://keycloak:8080
      LITV2_PUBLIC_API_BASE_URL: ${LITV2_PUBLIC_APP_URL:-http://127.0.0.1:5174}
      LITV2_FRONTEND_URL: ${LITV2_PUBLIC_APP_URL:-http://127.0.0.1:5174}
      LITV2_SESSION_SECRET: local-development-secret-with-32-characters
      LITV2_BOOTSTRAP_ADMIN_EMAILS: alice@example.test
      LITV2_S3_ENDPOINT_URL: http://minio:9000
      LITV2_S3_PUBLIC_ENDPOINT_URL: ${LITV2_PUBLIC_S3_URL:-http://127.0.0.1:9002}
      LITV2_S3_ACCESS_KEY: literature
      LITV2_S3_SECRET_KEY: literature-local-secret
      LITV2_S3_BUCKET: literature-workspace
      LITV2_CHAT_PROVIDER: ${LITV2_CHAT_PROVIDER:-fake}
      LITV2_CHAT_MODEL: ${LITV2_CHAT_MODEL:-fake-chat-model}
      LITV2_CHAT_OPENAI_API_KEY: ${LITV2_CHAT_OPENAI_API_KEY:-}
      LITV2_CHAT_OPENAI_BASE_URL: ${LITV2_CHAT_OPENAI_BASE_URL:-}
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./services/app
    environment: *app-environment
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8020
    ports:
      - "127.0.0.1:8020:8020"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  metadata-worker:
    build: ./services/app
    environment: *app-environment
    command: python -m backend.app.jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  chat-worker:
    build: ./services/app
    environment: *app-environment
    command: python -m backend.app.chat.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  pdf-text-test:
    profiles: ["document"]
    build: ./services/app
    environment:
      PDF_TEXT_TEST_DATA_DIR: /data
    command: >-
      python -m uvicorn backend.app.pdf_text_test.main:app
      --host 0.0.0.0 --port 8023 --workers 1
    ports:
      - "127.0.0.1:8023:8023"
    volumes:
      - pdf-text-test-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8023/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  document-worker:
    profiles: ["document"]
    build: ./services/app
    environment:
      <<: *app-environment
      LITV2_DOCUMENT_PDF_TEXT_URL: http://pdf-text-test:8023
    command: python -m backend.app.documents.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      pdf-text-test:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  keycloak-data:
  pdf-text-test-data:
